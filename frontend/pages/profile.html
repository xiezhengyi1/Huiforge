<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/static/ui/huiforge.svg" type="image/svg+xml" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; font-src 'self'; form-action 'self'" />
    <meta name="huiju-release" content="20260908-member-access-v41" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Huiforge · 个人中心</title>
    <link rel="stylesheet" href="css/layout.css?v=20261125-node-resize-v2" />
    <link rel="stylesheet" href="css/theme.css?v=20261125-ui-polish-v3" />
    <link rel="stylesheet" href="css/forge.css?v=20261125-ui-polish-v3" />
    <script src="js/theme.js?v=20261124-forge-v2"></script>
  </head>
  <body class="profile-page">
    <header class="profile-nav"><a href="studio.html"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/ui/icons-v1.svg#arrow-left"></use></svg> 返回工作台</a><a class="profile-brand forge-wordmark" href="index.html"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/ui/icons-v1.svg#brand"></use></svg>Huiforge</a><div class="page-nav-actions"><button class="language-toggle studio-utility" data-language-toggle type="button" aria-label="Language" aria-haspopup="dialog"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/ui/icons-v1.svg?v=20261125-ui-polish-v3#globe"></use></svg></button><a class="profile-balance" href="pricing.html" aria-label="查看额度"><span aria-hidden="true"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/ui/icons-v1.svg#spark"></use></svg></span><b id="nav-credit-total">—</b></a></div></header>
    <main class="profile-main">
      <section class="auth-panel" id="auth-panel">
        <div class="auth-showcase">
          <div class="auth-showcase-copy"><h1>你的创作账户</h1></div>
        </div>
        <div class="auth-card"><div class="auth-tabs" role="group" aria-label="账号操作"><button class="active" type="button" data-auth-tab="login">登录</button><button type="button" data-auth-tab="register">注册</button></div>
          <div class="auth-tabs auth-methods" role="group" aria-label="账号方式"><button type="button" data-auth-method="email" aria-pressed="false">邮箱</button><button class="active" type="button" data-auth-method="phone" aria-pressed="true">中国大陆手机号</button></div>
          <form id="login-form"><label>手机号<input name="phone" inputmode="numeric" autocomplete="tel" pattern="1[3-9][0-9]{9}" required /></label><label>密码<input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required /></label><button type="submit">登录</button></form>
          <form id="register-form" hidden><label>昵称<input name="display_name" autocomplete="nickname" maxlength="24" placeholder="例如：南川" /></label><label>手机号<input id="register-phone" name="phone" inputmode="numeric" autocomplete="tel" pattern="1[3-9][0-9]{9}" required /></label><label>短信验证码<span class="sms-code-field"><input id="register-sms-code" name="sms_code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,8}" maxlength="8" required /><button id="send-sms-code" type="button">获取验证码</button></span></label><label>密码<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required /></label><button id="register-submit" type="submit">创建账号</button><small class="sms-availability" id="sms-availability" role="status">正在检查短信服务…</small></form>
          <form id="email-login-form" hidden><label>邮箱<input type="email" name="email" autocomplete="username" maxlength="254" required /></label><label>密码<input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required /></label><button type="submit">登录</button></form>
          <form id="email-register-form" hidden><label>昵称<input name="display_name" autocomplete="nickname" maxlength="24" /></label><label>邮箱<input type="email" name="email" id="register-email" autocomplete="email" maxlength="254" required /></label><label>邮箱验证码<span class="sms-code-field"><input id="register-email-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required /><button id="send-email-code" type="button" disabled>获取验证码</button></span></label><label>密码<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required /></label><button id="email-register-submit" type="submit" disabled>创建账号</button><small class="sms-availability" id="email-availability" role="status"></small></form>
          <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
        </div>
      </section>

      <section class="account-shell" id="account-shell" hidden>
        <aside class="identity-card"><label class="avatar-control" for="avatar-input"><img id="profile-avatar" alt="用户头像" hidden /><span id="avatar-placeholder" aria-hidden="true">绘</span><i>更换头像</i><input id="avatar-input" type="file" accept="image/png,image/jpeg,image/webp" /></label><p id="profile-membership">免费用户</p><h2 id="profile-display-name">绘域用户</h2><span id="profile-phone"></span><p class="profile-bio-preview" id="profile-bio-preview">还没有个人简介。</p><nav><a href="#credit-details">额度明细</a><a href="#account-history">云端创作记录</a><a href="pricing.html">会员与充值 <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/ui/icons-v1.svg#arrow-up-right"></use></svg></a></nav><button id="logout-button" type="button">退出登录</button></aside>
        <div class="account-content">
          <section class="profile-edit"><div class="section-title"><div><p>资料</p><h2>个人资料</h2></div></div><form id="profile-form"><label>昵称<input id="display-name-input" name="display_name" maxlength="24" required /></label><label>个人简介<textarea id="bio-input" name="bio" maxlength="160" rows="3" placeholder="介绍你的创作方向"></textarea></label><button type="submit">保存资料</button><span id="profile-message" role="status"></span></form></section>

          <section class="credit-details" id="credit-details"><div class="section-title"><div><p>额度</p><h2>可用额度</h2></div><a href="pricing.html">充值与会员 <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/ui/icons-v1.svg#arrow-up-right"></use></svg></a></div><div class="credit-cards"><article><span>每日赠送</span><b id="credit-daily">—</b><small>今日 24:00 过期</small></article><article><span>会员额度</span><b id="credit-monthly">—</b><small>本订阅周期有效</small></article><article><span>直充额度</span><b id="credit-topup">—</b><small>充值后 24 个月有效</small></article></div><div class="ledger"><h3>最近流水</h3><div id="credit-ledger"></div><p id="ledger-empty">暂无额度流水。</p></div></section>

          <section class="account-history" id="account-history"><div class="section-title"><div><p>记录</p><h2>云端创作记录</h2></div><span>最多保留最近 200 张登录后生成的图片</span></div><div class="account-history-grid" id="account-history-grid"></div><div class="account-history-empty" id="account-history-empty"><span><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/ui/icons-v1.svg#image"></use></svg></span><b>还没有云端记录</b></div></section>
        </div>
      </section>
    </main>
    <dialog class="profile-history-dialog" id="profile-history-dialog"><button class="dialog-close" id="profile-history-close" type="button" aria-label="关闭"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/static/ui/icons-v1.svg#close"></use></svg></button><img id="profile-history-image" alt="生成作品大图" /><div><span id="profile-history-kind"></span><h2>创作提示词</h2><blockquote id="profile-history-prompt"></blockquote><div class="profile-history-actions"><a id="profile-history-use" href="studio.html">继续创作</a><button id="profile-history-delete" type="button">删除记录</button></div></div></dialog>
    <script type="module" src="js/profile.js?v=20261125-ui-polish-v3"></script>
  </body>
</html>
